name: Release

# 经 Changesets + npm Trusted Publishing(OIDC,无 token)发布 @yiong/railguard,
# 附 provenance 签发。流程:
# main 上存在 changeset 文件时,changesets/action 开/更新「Version Packages」PR;
# 该 PR 合并(changesets 被消费)后,本工作流再次运行并执行 `pnpm run release`
# (= changeset publish)完成发布。
#
# 一次性前置(人工,见 RELEASING.md):
# 1) 首个版本需本地手动 `npm publish`(包不存在就没有 Settings 页,挂不了 Trusted Publisher);
# 2) npmjs.com → @yiong/railguard → Settings → Trusted Publisher:
#    user `yiongq` / repo `railguard` / workflow `release.yml`,
#    并且必须勾选 `npm publish` 动作(2026-05-20 起新配置不勾即拒发)。

on:
  push:
    branches: [main]

permissions:
  contents: write # changesets 开 Version PR / 打 release tag
  pull-requests: write # changesets 维护 Version PR
  id-token: write # OIDC Trusted Publishing(必需——无 token 发布)

# 刻意不设 concurrency.cancel-in-progress:发布中途被下一次 merge 取消
# 会留下「tag 打了包没发」的半成品状态。

jobs:
  release:
    name: Version / Publish (Changesets + provenance)
    runs-on: ubuntu-latest # Trusted Publishing 要求云托管 runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Node 22 自带 npm 10.x;Trusted Publishing(OIDC)需要 npm >= 11.5.1
      - name: Upgrade npm (>= 11.5.1 for OIDC)
        run: npm i -g npm@latest
      - run: pnpm install --frozen-lockfile
      # 质量门在 prepublishOnly 里(check + build + check:package),publish 时自动跑
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # `pnpm run version` 而非 `pnpm version`:后者是 pnpm 内建命令,
          # 会遮蔽 npm script,导致 changeset version 永远不执行(不 bump、无 CHANGELOG)
          publish: pnpm run release
          version: pnpm run version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无 NPM_TOKEN:OIDC 无 token 发布,不要再引入
